---
- name: Setup VMs' and k3s cluster
  gather_facts: false
  hosts: all

  vars:
    k3s_opts: >
      --disable servicelb --disable traefik
      --tls-san {{ api_domain }} --tls-san {{ api_ip }}

  tasks:
    - name: Update and configure debian
      ansible.builtin.include_tasks: ./debian-setup.yaml

    - name: Download k3s binary
      ansible.builtin.get_url:
        url: https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/k3s
        checksum: sha256:https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/sha256sum-amd64.txt
        dest: /usr/local/bin/k3s
        mode: "750"

    # Setup cluster
    - name: Stop k3s services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      failed_when: false
      loop:
        - k3s
        - k3s-init

    - name: Init cluster via transient k3s-init service
      ansible.builtin.command:
        cmd: >
          systemd-run -p RestartSec=2 -p Restart=on-failure --unit=k3s-init
          k3s server --token={{ token }} {{ k3s_opts }}
          --cluster-init
        creates: "/etc/systemd/system/k3s-init.service"
      when: inventory_hostname == groups["nodes"][0]

    - name: Setup kube-vip and kube-vip-cloud-controller
      ansible.builtin.include_tasks: ./kube-vip.yaml

    - name: Join cluster via transient k3s-init service
      ansible.builtin.command:
        cmd: >
          systemd-run -p RestartSec=2 -p Restart=on-failure --unit=k3s-init
          k3s server --token={{ token }} {{ k3s_opts }}
          --server=https://{{ groups["nodes"][0] }}:6443
        creates: "/etc/systemd/system/k3s-init.service"
      when: inventory_hostname != groups["nodes"][0]

    - name: Verification
      when: not ansible_check_mode
      block:
        - name: Verify that all nodes joined
          ansible.builtin.command:
            cmd: k3s kubectl get nodes -l 'node-role.kubernetes.io/control-plane=true' -o=jsonpath='{.items[*].metadata.name}'
          register: nodes
          until: nodes.rc == 0 and (nodes.stdout.split() | length) == (groups["nodes"] | length)
          retries: 10
          delay: 10
          changed_when: false
      always:
        - name: Kill the temporary service used for initialization
          ansible.builtin.systemd:
            name: k3s-init
            state: stopped
          failed_when: false

    - name: Copy k3s.service
      ansible.builtin.template:
        src: ./k3s.service.j2
        dest: /etc/systemd/system/k3s.service
        mode: "644"

    - name: Enable and check K3s service
      ansible.builtin.systemd:
        name: k3s
        daemon_reload: true
        state: restarted
        enabled: true

    - name: Wait for node-token
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token

    - name: Read node-token from master
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token

    - name: Store Master node-token
      ansible.builtin.set_fact:
        token: "{{ node_token.content | b64decode | regex_replace('\n', '') }}"

    - name: Configure cluster endpoint
      ansible.builtin.command: k3s kubectl config set-cluster default --server https://{{ api_domain }}:6443
      changed_when: true

    - name: Create kubectl symlink
      ansible.builtin.file:
        src: /usr/local/bin/k3s
        dest: /usr/local/bin/kubectl
        state: link

    - name: Copying kubeconfig from {{ groups["nodes"][0] }}
      ansible.builtin.fetch:
        src: "/etc/rancher/k3s/k3s.yaml"
        dest: ../kubeconfig
        flat: true
      when: inventory_hostname == groups["nodes"][0]
