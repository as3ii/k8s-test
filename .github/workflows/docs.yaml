name: PDF Docs

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release'
        required: false
        default: test
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: 0
          purge-primary-key: never
      - run: nix flake check
      - name: Build docs (it)
        run: nix build -L .#docs-it && mv ./result docs-it.pdf
      - name: Upload docs-it
        uses: actions/upload-artifact@v4
        with:
          name: docs-it.pdf
          path: ./docs-it.pdf
          retention-days: 1
      # - name: Build docs (en)
      #   run: nix build -L .#docs-en && mv ./result docs-en.pdf
      # - name: Upload docs-en
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: docs-en.pdf
      #     path: ./docs-en.pdf
      #     retention-days: 1

  publish-pdf:
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name == 'workflow_dispatch'
        run: echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
      - if: github.event_name == 'push'
        run: |
          TAG=${{ github.ref }}
          echo "TAG=${TAG#refs/tags/}" >> $GITHUB_ENV
      - name: Download PDFs
        uses: actions/download-artifact@v4
        with:
          pattern: "*.pdf"
          path: "pdf"
          merge-multiple: true
      - name: Create Github Release
        run: |
          tag="${{ env.TAG }}"
          gh release create "$tag" --title "$tag" --target "$GITHUB_SHA" pdf/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
